name: Build, test, and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create or update the release for this commit after all builds pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sbom-analyzer-pr-{0}', github.event.pull_request.number) || 'sbom-analyzer-release' }}
  cancel-in-progress: false

env:
  FPC_VERSION: '3.2.2'
  LAZARUS_VERSION: '4.2'

jobs:
  prepare:
    name: Determine build version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      short_commit: ${{ steps.version.outputs.short_commit }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: version
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
        run: |
          mode=development
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mode=release
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            if [[ "$PUBLISH_RELEASE" == true ]]; then
              mode=release
            else
              mode=rebuild
            fi
          fi
          scripts/calculate-version.sh "$mode" "$GITHUB_SHA" "$GITHUB_OUTPUT"

      - name: Show selected version
        shell: bash
        run: |
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Release: ${{ steps.version.outputs.is_release }}"

  build:
    name: ${{ matrix.config.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows x64 / Win32
            id: windows
            os: windows-latest
            widgetset: win32
            package_suffix: windows-x64.zip
            use_cache: 'true'
            laz_url: https://sourceforge.net/projects/lazarus/files/Lazarus Windows 64 bits/Lazarus 4.2/lazarus-4.2-fpc-3.2.2-win64.exe
            fpc_url: ''
          - name: Linux x64 / GTK3
            id: linux
            os: ubuntu-latest
            widgetset: gtk3
            package_suffix: linux-x64
            use_cache: 'true'
            laz_url: https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/lazarus-project_4.2.0-0_amd64.deb
            fpc_url: |-
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/fpc-laz_3.2.2-210709_amd64.deb
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.2/fpc-src_3.2.2-210709_amd64.deb
          - name: macOS x64 / Cocoa
            id: macos
            os: macos-15-intel
            widgetset: cocoa
            package_suffix: macos.zip
            use_cache: 'false'
            laz_url: https://sourceforge.net/projects/lazarus/files/Lazarus macOS x86-64/Lazarus 4.2/lazarus-darwin-x86_64-4.2.zip
            fpc_url: https://sourceforge.net/projects/lazarus/files/Lazarus macOS x86-64/Lazarus 4.2/fpc-3.2.2.intelarm64-macosx.dmg
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux GTK3 headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-3-dev

      - name: Install pinned Lazarus and Free Pascal
        uses: ollydev/setup-lazarus@2d902bfe7bf72ac91c6ee21130ed599ccc839bc7 # v4
        with:
          use-cache: ${{ matrix.config.use_cache }}
          laz-url: ${{ matrix.config.laz_url }}
          fpc-url: ${{ matrix.config.fpc_url }}

      - name: Add bundled Windows Free Pascal to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fpc = Get-ChildItem -Path "$env:RUNNER_TEMP\lazarus\fpc" -Filter fpc.exe -Recurse |
            Select-Object -First 1
          if (-not $fpc) {
            throw 'The Lazarus installation does not contain fpc.exe'
          }
          $fpc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain versions
        run: |
          test "$(fpc -iV)" = "$FPC_VERSION"
          lazbuild --version | grep -F "$LAZARUS_VERSION"

      - name: Generate application version unit
        run: scripts/write-version.sh '${{ needs.prepare.outputs.version }}' "$GITHUB_SHA"

      - name: Run non-UI tests
        run: scripts/run-tests.sh -Px86_64

      - name: Build native application
        run: >-
          lazbuild -B --build-mode=Release
          --widgetset=${{ matrix.config.widgetset }}
          --cpu=x86_64 src/sbom_analyzer.lpi

      - name: Package and verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'build/package-windows'
          $package = 'dist/sbom-analyzer-v${{ needs.prepare.outputs.version }}-windows-x64.zip'
          New-Item -ItemType Directory -Force -Path $stage, 'dist' | Out-Null
          Copy-Item 'build/release/sbom-analyzer.exe' "$stage/sbom-analyzer.exe"
          Compress-Archive -Path "$stage/sbom-analyzer.exe" -DestinationPath $package -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $package))
          try {
            $files = @($archive.Entries | Where-Object { -not $_.FullName.EndsWith('/') })
            if ($files.Count -ne 1 -or $files[0].FullName -ne 'sbom-analyzer.exe') {
              throw 'Windows archive must contain exactly sbom-analyzer.exe'
            }
          } finally {
            $archive.Dispose()
          }

      - name: Package and verify Linux executable
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          package='dist/sbom-analyzer-v${{ needs.prepare.outputs.version }}-linux-x64'
          cp build/release/sbom-analyzer "$package"
          chmod 755 "$package"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 1
          file "$package" | grep -E 'ELF 64-bit.*x86-64'

      - name: Package and verify macOS application
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh '${{ needs.prepare.outputs.version }}'

      - name: Upload temporary build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-${{ matrix.config.id }}
          path: dist/sbom-analyzer-v${{ needs.prepare.outputs.version }}-${{ matrix.config.package_suffix }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.is_release == 'true' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download successful platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Verify available release contents and write checksums
        shell: bash
        run: |
          cd release-assets
          version='${{ needs.prepare.outputs.version }}'
          windows="sbom-analyzer-v${version}-windows-x64.zip"
          linux="sbom-analyzer-v${version}-linux-x64"
          macos="sbom-analyzer-v${version}-macos.zip"
          available=()

          if [[ -f "$windows" ]]; then
            test "$(unzip -Z1 "$windows" | grep -Evc '/$')" -eq 1
            test "$(unzip -Z1 "$windows")" = 'sbom-analyzer.exe'
            unzip -p "$windows" | file - | grep -E 'PE32\+ executable.*x86-64'
            available+=("$windows")
          fi

          if [[ -f "$linux" ]]; then
            file "$linux" | grep -E 'ELF 64-bit.*x86-64'
            chmod 755 "$linux"
            available+=("$linux")
          fi

          if [[ -f "$macos" ]]; then
            test "$(unzip -Z1 "$macos" | grep -Ec '^SBOM Analyzer\.app/Contents/MacOS/[^/]+$')" -eq 1
            unzip -p "$macos" 'SBOM Analyzer.app/Contents/MacOS/sbom-analyzer' |
              file - | grep -E 'Mach-O 64-bit.*x86_64'
            available+=("$macos")
          fi

          test "${#available[@]}" -gt 0
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#available[@]}"
          printf 'Publishing %s\n' "${available[@]}"
          sha256sum "${available[@]}" > SHA256SUMS.txt

      - name: Create or verify version tag
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test -n "$TAG"
          git fetch --force --tags
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tagged_commit=$(git rev-list -n 1 "$TAG")
            test "$tagged_commit" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$GITHUB_SHA" -m "SBOM Analyzer $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Generate concise release notes
        shell: bash
        env:
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          {
            echo "SBOM Analyzer $TAG"
            echo
            echo 'Changes:'
            if [[ -n "$PREVIOUS_TAG" ]]; then
              git log --format='- %s' "${PREVIOUS_TAG}..${GITHUB_SHA}"
            else
              git log --format='- %s' "$GITHUB_SHA"
            fi
          } > release-notes.md
          if ! grep -q '^- ' release-notes.md; then
            echo "- Rebuild ${GITHUB_SHA:0:8}" >> release-notes.md
          fi

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "SBOM Analyzer $TAG" --notes-file release-notes.md
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "SBOM Analyzer $TAG" --notes-file release-notes.md
          fi

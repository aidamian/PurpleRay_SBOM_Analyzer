name: Build, test, and release

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Create or update the release for this commit after all builds pass
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('purpleray-sbom-analyzer-pr-{0}', github.event.pull_request.number) || 'purpleray-sbom-analyzer-release' }}
  # New commits may supersede an open PR run, but a release run must finish so
  # its version tag can never be left without the corresponding release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FPC_VERSION: '3.2.2'
  LAZARUS_VERSION: '4.8'
  LAZARUS_WINDOWS_SHA256: 'ED25EE171D55E23CF14E0633159FDD2325EFBA56E186F8AB817AD3BF97D267D7'

jobs:
  prepare:
    name: Read build version
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      short_commit: ${{ steps.version.outputs.short_commit }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Read operator-managed version
        id: version
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
        run: |
          if [[ ! -f VERSION ]]; then
            echo 'The tracked VERSION file is missing.' >&2
            exit 1
          fi
          if [[ $(awk 'END { print NR }' VERSION) -ne 1 ]]; then
            echo 'VERSION must contain exactly one line.' >&2
            exit 1
          fi

          version=$(<VERSION)
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$version" =~ $version_pattern ]]; then
            echo "VERSION must contain MAJOR.MINOR.PATCH without prefixes or suffixes: '$version'" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          for version_part in "$major" "$minor" "$patch"; do
            if (( 10#$version_part > 65535 )); then
              echo "VERSION component exceeds the Windows resource limit: $version_part" >&2
              exit 1
            fi
          done

          tag="v${version}"
          short_commit=$(git rev-parse --short=8 "$GITHUB_SHA")
          tagged_commit=''
          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            tagged_commit=$(git rev-list -n 1 "$tag")
          fi
          previous_tag=$(
            git tag --merged "$GITHUB_SHA" --list 'v*' --sort=-v:refname |
              grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' |
              grep -vxF "$tag" |
              head -n 1 || true
          )

          is_release=false
          if [[ "$GITHUB_EVENT_NAME" == push && -z "$tagged_commit" ]]; then
            # A push releases only when the operator has selected a VERSION
            # that does not have a release tag yet.
            is_release=true
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$PUBLISH_RELEASE" == true ]]; then
            if [[ -n "$tagged_commit" && "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "$tag already belongs to $tagged_commit; update VERSION before publishing." >&2
              exit 1
            fi
            is_release=true
          fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "previous_tag=$previous_tag"
            echo "short_commit=$short_commit"
            echo "is_release=$is_release"
          } >> "$GITHUB_OUTPUT"

      - name: Show selected version
        shell: bash
        run: |
          echo "Version: ${{ steps.version.outputs.version }}"
          echo "Publish release: ${{ steps.version.outputs.is_release }}"

  build:
    name: ${{ matrix.config.name }}
    needs: prepare
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows x64 / Win32
            id: windows
            os: windows-latest
            widgetset: win32
            use_cache: 'true'
            laz_url: https://sourceforge.net/projects/lazarus/files/Lazarus%20Windows%2064%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win64.exe/download
            fpc_url: ''
          - name: Linux x64 / GTK3
            id: linux
            os: ubuntu-24.04
            widgetset: gtk3
            use_cache: 'true'
            laz_url: https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.8/lazarus-project_4.8.0-0_amd64.deb
            fpc_url: |-
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.8/fpc-laz_3.2.2-210709_amd64.deb
              https://sourceforge.net/projects/lazarus/files/Lazarus Linux amd64 DEB/Lazarus 4.8/fpc-src_3.2.2-210709_amd64.deb
          # macOS builds are temporarily paused to conserve GitHub Actions
          # minutes. Re-enable by uncommenting this complete matrix entry.
          # - name: macOS x64 / Cocoa
          #   id: macos
          #   os: macos-15-intel
          #   widgetset: cocoa
          #   use_cache: 'true'
          #   laz_url: https://sourceforge.net/projects/lazarus/files/Lazarus macOS x86-64/Lazarus 4.8/lazarus-darwin-x86_64-4.8.zip
          #   fpc_url: https://sourceforge.net/projects/freepascal/files/Mac OS X/3.2.2/fpc-3.2.2.intelarm64-macosx.dmg
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Linux GTK build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sources_file="$RUNNER_TEMP/purpleray-sbom-analyzer-ubuntu.sources"
          write_sources() {
            local mirror="$1"
            printf '%s\n' \
              'Types: deb' \
              "URIs: $mirror" \
              'Suites: noble noble-updates noble-security' \
              'Components: main universe' \
              'Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg' \
              > "$sources_file"
          }

          apt_options=(
            -o "Dir::Etc::sourcelist=$sources_file"
            -o 'Dir::Etc::sourceparts=-'
            -o 'Acquire::Languages=none'
            -o 'Acquire::Retries=0'
            -o 'Acquire::http::Timeout=20'
            -o 'Acquire::https::Timeout=20'
            -o 'Dpkg::Use-Pty=0'
          )

          write_sources 'https://archive.ubuntu.com/ubuntu'
          if ! sudo timeout --signal=TERM --kill-after=10s 60s \
            apt-get update "${apt_options[@]}"; then
            echo 'Primary Ubuntu mirror failed; trying the signed kernel.org mirror.' >&2
            write_sources 'https://mirrors.edge.kernel.org/ubuntu'
            sudo timeout --signal=TERM --kill-after=10s 90s \
              apt-get update "${apt_options[@]}"
          fi

          sudo env DEBIAN_FRONTEND=noninteractive \
            timeout --signal=TERM --kill-after=10s 120s \
            apt-get install "${apt_options[@]}" \
              --yes --no-install-recommends libgtk-3-dev libgtk2.0-dev \
              appstream desktop-file-utils python3-jsonschema

      - name: Cache pinned Linux toolchain installers
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/installers
          key: lazarus-linux-x64-${{ env.LAZARUS_VERSION }}-fpc-${{ env.FPC_VERSION }}-sourceforge-debs-v2

      - name: Cache pinned Windows toolchain installer
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/installers
          key: lazarus-windows-x64-${{ env.LAZARUS_VERSION }}-fpc-${{ env.FPC_VERSION }}-sourceforge-exe-v1

      # Digests: https://www.lazarus-ide.org/index.php?page=checksums
      - name: Download pinned Linux toolchain installers
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          installer_dir="$RUNNER_TEMP/installers"
          mkdir -p "$installer_dir"

          download_installer() {
            local filename="$1"
            local url="$2"
            local expected_sha256="$3"
            local target
            target="$installer_dir/$filename"
            if [[ -f "$target" ]] && \
              echo "$expected_sha256  $target" | sha256sum --check --status -; then
              return
            fi
            curl --fail --show-error --silent --location \
              --retry 4 --retry-all-errors --retry-max-time 240 \
              --connect-timeout 15 --max-time 240 \
              --output "$target.partial" "$url"
            echo "$expected_sha256  $target.partial" | sha256sum --check --status -
            mv "$target.partial" "$target"
          }

          download_pids=()
          download_installer \
            'fpc-laz_3.2.2-210709_amd64.deb' \
            'https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/fpc-laz_3.2.2-210709_amd64.deb/download' \
            '92000f2b831184e153aab0c910f8ae9240450e5c6d76dc189cf53116ee501d83' &
          download_pids+=("$!")
          download_installer \
            'fpc-src_3.2.2-210709_amd64.deb' \
            'https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/fpc-src_3.2.2-210709_amd64.deb/download' \
            '8c9e145d8056754a9ca39ce3e52e982b8e4816124984c5f542f2a874e721ad53' &
          download_pids+=("$!")
          download_installer \
            'lazarus-project_4.8.0-0_amd64.deb' \
            'https://sourceforge.net/projects/lazarus/files/Lazarus%20Linux%20amd64%20DEB/Lazarus%204.8/lazarus-project_4.8.0-0_amd64.deb/download' \
            '401742cefb01ad99a628188034bf728fb5360d641ed2be5f91fb0ee183a301cd' &
          download_pids+=("$!")

          download_status=0
          for download_pid in "${download_pids[@]}"; do
            wait "$download_pid" || download_status=1
          done
          test "$download_status" -eq 0

      - name: Install pinned Linux Lazarus and Free Pascal
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          installer_dir="$RUNNER_TEMP/installers"
          (
            cd "$installer_dir"
            printf '%s\n' \
              '92000f2b831184e153aab0c910f8ae9240450e5c6d76dc189cf53116ee501d83  fpc-laz_3.2.2-210709_amd64.deb' \
              '8c9e145d8056754a9ca39ce3e52e982b8e4816124984c5f542f2a874e721ad53  fpc-src_3.2.2-210709_amd64.deb' \
              '401742cefb01ad99a628188034bf728fb5360d641ed2be5f91fb0ee183a301cd  lazarus-project_4.8.0-0_amd64.deb' \
              | sha256sum --check --strict -
          )
          test "$(dpkg-deb --field "$installer_dir/fpc-laz_3.2.2-210709_amd64.deb" Package)" = 'fpc-laz'
          test "$(dpkg-deb --field "$installer_dir/fpc-laz_3.2.2-210709_amd64.deb" Version)" = "$FPC_VERSION"
          test "$(dpkg-deb --field "$installer_dir/fpc-src_3.2.2-210709_amd64.deb" Package)" = 'fpc-src'
          test "$(dpkg-deb --field "$installer_dir/fpc-src_3.2.2-210709_amd64.deb" Version)" = "$FPC_VERSION"
          test "$(dpkg-deb --field "$installer_dir/lazarus-project_4.8.0-0_amd64.deb" Package)" = 'lazarus-project'
          test "$(dpkg-deb --field "$installer_dir/lazarus-project_4.8.0-0_amd64.deb" Version)" = '4.8.0'
          sudo dpkg --install \
            "$installer_dir/fpc-laz_3.2.2-210709_amd64.deb" \
            "$installer_dir/fpc-src_3.2.2-210709_amd64.deb" \
            "$installer_dir/lazarus-project_4.8.0-0_amd64.deb"

      - name: Download and verify pinned Windows toolchain installer
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 5
        env:
          INSTALLER_URL: ${{ matrix.config.laz_url }}
        run: |
          $installerDirectory = Join-Path $env:RUNNER_TEMP 'installers'
          $installer = Join-Path $installerDirectory 'lazarus-win64.exe'
          $partial = "$installer.partial"
          New-Item -ItemType Directory -Force -Path $installerDirectory | Out-Null

          function Test-Installer([string] $Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) {
              return $false
            }
            $actual = (Get-FileHash -LiteralPath $Path -Algorithm SHA256).Hash
            return $actual -eq $env:LAZARUS_WINDOWS_SHA256
          }

          if (-not (Test-Installer $installer)) {
            Remove-Item -LiteralPath $partial -Force -ErrorAction SilentlyContinue
            & curl.exe --fail --show-error --silent --location `
              --retry 4 --retry-all-errors --retry-max-time 240 `
              --connect-timeout 15 --max-time 240 `
              --output $partial $env:INSTALLER_URL
            if ($LASTEXITCODE -ne 0) {
              throw "Lazarus installer download failed with exit code $LASTEXITCODE"
            }
            if (-not (Test-Installer $partial)) {
              throw 'The Lazarus installer does not match its official SHA-256 digest'
            }
            Move-Item -LiteralPath $partial -Destination $installer -Force
          }

      - name: Install pinned Windows Lazarus and Free Pascal
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 7
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'installers\lazarus-win64.exe'
          $installDirectory = Join-Path $env:RUNNER_TEMP 'lazarus'
          & $installer '/VERYSILENT' '/SUPPRESSMSGBOXES' '/NORESTART' '/SP-' `
            "/DIR=$installDirectory"
          if ($LASTEXITCODE -ne 0) {
            throw "Lazarus installer failed with exit code $LASTEXITCODE"
          }

      - name: Install pinned Lazarus and Free Pascal for experimental macOS
        if: runner.os == 'macOS'
        timeout-minutes: 7
        uses: ollydev/setup-lazarus@2d902bfe7bf72ac91c6ee21130ed599ccc839bc7 # v4
        with:
          use-cache: ${{ matrix.config.use_cache }}
          laz-url: ${{ matrix.config.laz_url }}
          fpc-url: ${{ matrix.config.fpc_url }}

      - name: Add installed Windows Lazarus and Free Pascal to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $lazbuild = Get-ChildItem -Path "$env:RUNNER_TEMP\lazarus" `
            -Filter lazbuild.exe -File -Recurse | Select-Object -First 1
          $fpc = Get-ChildItem -Path "$env:RUNNER_TEMP\lazarus\fpc" -Filter fpc.exe -Recurse |
            Select-Object -First 1
          if ((-not $lazbuild) -or (-not $fpc)) {
            throw 'The Lazarus installation does not contain lazbuild.exe and fpc.exe'
          }
          $lazbuild.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $fpc.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify toolchain versions
        run: |
          test "$(fpc -iV)" = "$FPC_VERSION"
          test "$(lazbuild --version | tr -d '\r')" = "$LAZARUS_VERSION"

      - name: Generate application version unit
        run: scripts/write-version.sh '${{ needs.prepare.outputs.version }}' "$GITHUB_SHA"

      - name: Run non-UI tests
        env:
          PURPLERAY_CYCLONEDX_FIXTURE_DIR: ${{ runner.temp }}/cyclonedx-fixtures
        run: scripts/run-tests.sh -Px86_64

      - name: Build native application
        run: >-
          lazbuild -B --build-mode=Release
          --widgetset=${{ matrix.config.widgetset }}
          --cpu=x86_64 src/purpleray_sbom_analyzer.lpi

      - name: Verify native Linux command line without a display
        if: runner.os == 'Linux'
        shell: bash
        run: |
          application='build/release/purpleray-sbom-analyzer'
          version='${{ needs.prepare.outputs.version }}'
          cli_root="$RUNNER_TEMP/purpleray-cli-smoke"
          target="$cli_root/target-ță"
          output="$cli_root/result-ță.cdx.json"
          mkdir -p "$target"
          printf '%s\n' \
            '{"name":"ci-headless-fixture","version":"1.0.0","dependencies":{"lodash":"4.17.20"}}' \
            > "$target/package.json"

          profile_fingerprint() {
            local root
            for root in "$HOME/.purpleray" "$HOME/.sbom-analyzer"; do
              if [[ ! -e "$root" ]]; then
                printf 'ABSENT|%s\n' "$root"
                continue
              fi
              find "$root" -printf 'ENTRY|%y|%P|%s|%T@\n' | sort
              find "$root" -type f -print0 | sort -z |
                xargs -0 -r sha256sum
            done | sha256sum | awk '{ print $1 }'
          }
          profile_before=$(profile_fingerprint)

          version_output=$(env -u DISPLAY -u WAYLAND_DISPLAY \
            "$application" --version)
          test "$version_output" = "PurpleRay SBOM Analyzer $version"
          env -u DISPLAY -u WAYLAND_DISPLAY \
            "$application" --help > "$cli_root/help.stdout" \
            2> "$cli_root/help.stderr"
          grep -F 'Usage:' "$cli_root/help.stdout"
          test ! -s "$cli_root/help.stderr"

          set +e
          env -u DISPLAY -u WAYLAND_DISPLAY \
            "$application" --unknown > "$cli_root/usage.stdout" \
            2> "$cli_root/usage.stderr"
          usage_status=$?
          set -e
          test "$usage_status" -eq 2
          test ! -s "$cli_root/usage.stdout"
          grep -F 'unknown argument: --unknown' "$cli_root/usage.stderr"

          env -u DISPLAY -u WAYLAND_DISPLAY \
            "$application" --scan "$target" --output "$output" \
            > "$cli_root/scan.stdout" 2> "$cli_root/scan.stderr"
          grep -F "SBOM written: $output" "$cli_root/scan.stdout"
          test ! -s "$cli_root/scan.stderr"
          test -s "$output"
          test "$(profile_fingerprint)" = "$profile_before"

      - name: Verify native Windows command line with redirected streams
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $application = (Resolve-Path 'build/release/purpleray-sbom-analyzer.exe').Path
          $version = '${{ needs.prepare.outputs.version }}'
          $cliRoot = Join-Path $env:RUNNER_TEMP 'purpleray-cli-ță'
          $target = Join-Path $cliRoot 'target-ță'
          $output = Join-Path $cliRoot 'result-ță.cdx.json'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $target 'package.json'),
            '{"name":"ci-headless-fixture","version":"1.0.0","dependencies":{"lodash":"4.17.20"}}',
            [Text.UTF8Encoding]::new($false)
          )

          function Get-ProfileFingerprint {
            $userProfile = [Environment]::GetFolderPath(
              [Environment+SpecialFolder]::UserProfile
            )
            $roots = @(
              (Join-Path $userProfile '.purpleray'),
              (Join-Path $userProfile '.sbom-analyzer')
            )
            $records = foreach ($root in $roots) {
              if (-not (Test-Path -LiteralPath $root)) {
                "ABSENT|$root"
                continue
              }
              $rootItem = Get-Item -LiteralPath $root -Force
              "DIRECTORY|$($rootItem.FullName)|$($rootItem.LastWriteTimeUtc.Ticks)"
              Get-ChildItem -LiteralPath $root -Force -Recurse | Sort-Object FullName |
                ForEach-Object {
                  if ($_.PSIsContainer) {
                    'DIRECTORY|{0}|{1}' -f $_.FullName, $_.LastWriteTimeUtc.Ticks
                  }
                  else {
                    $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
                    'FILE|{0}|{1}|{2}|{3}' -f $_.FullName, $_.Length,
                      $_.LastWriteTimeUtc.Ticks, $hash
                  }
                }
            }
            return ($records -join "`n")
          }

          function Invoke-NativeCli {
            param([Parameter(Mandatory = $true)][string[]]$Arguments)

            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $application
            $startInfo.WorkingDirectory = (Split-Path -Parent $application)
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $startInfo.RedirectStandardOutput = $true
            $startInfo.RedirectStandardError = $true
            $startInfo.StandardOutputEncoding = [Text.UTF8Encoding]::new($false)
            $startInfo.StandardErrorEncoding = [Text.UTF8Encoding]::new($false)
            foreach ($argument in $Arguments) {
              [void]$startInfo.ArgumentList.Add($argument)
            }
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            if (-not $process.Start()) {
              throw 'Unable to start the native command-line smoke process'
            }
            $stdoutTask = $process.StandardOutput.ReadToEndAsync()
            $stderrTask = $process.StandardError.ReadToEndAsync()
            if (-not $process.WaitForExit(120000)) {
              $process.Kill($true)
              throw 'Native command-line smoke process timed out'
            }
            $process.Refresh()
            if ($process.MainWindowHandle -ne [IntPtr]::Zero) {
              throw 'A command-line invocation created a main window'
            }
            [PSCustomObject]@{
              ExitCode = $process.ExitCode
              Stdout = $stdoutTask.Result
              Stderr = $stderrTask.Result
            }
          }

          $profileBefore = Get-ProfileFingerprint
          $result = Invoke-NativeCli -Arguments @('--version')
          if ($result.ExitCode -ne 0 -or
              $result.Stdout.TrimEnd([char[]]"`r`n") -cne
                "PurpleRay SBOM Analyzer $version" -or $result.Stderr) {
            throw "Native --version failed: $($result | ConvertTo-Json -Compress)"
          }
          $result = Invoke-NativeCli -Arguments @('--help')
          if ($result.ExitCode -ne 0 -or $result.Stdout -notmatch '(?m)^Usage:$' -or
              $result.Stderr) {
            throw 'Native --help failed'
          }
          $result = Invoke-NativeCli -Arguments @('--unknown')
          if ($result.ExitCode -ne 2 -or $result.Stdout -or
              $result.Stderr -notmatch 'unknown argument: --unknown') {
            throw 'Native unknown-option handling failed'
          }
          $result = Invoke-NativeCli -Arguments @(
            '--scan', $target, '--output', $output
          )
          if ($result.ExitCode -ne 0 -or
              $result.Stdout.TrimEnd([char[]]"`r`n") -cne
                "SBOM written: $output" -or $result.Stderr) {
            throw "Native headless scan failed: $($result | ConvertTo-Json -Compress)"
          }
          if (-not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw 'Native headless scan did not create its requested output'
          }
          $bom = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
          if ($bom.bomFormat -cne 'CycloneDX' -or $bom.specVersion -cne '1.7') {
            throw 'Native headless output is not CycloneDX 1.7 JSON'
          }
          $profileAfter = Get-ProfileFingerprint
          if ($profileAfter -cne $profileBefore) {
            throw 'Native command-line invocations changed desktop application data'
          }

      - name: Validate generated CycloneDX 1.6 and 1.7 documents
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: >-
          python3 scripts/validate-cyclonedx.py --self-test
          --timeout-seconds 15
          "$RUNNER_TEMP/cyclonedx-fixtures/structure-1.6.cdx.json"
          "$RUNNER_TEMP/cyclonedx-fixtures/structure-1.7.cdx.json"
          "$RUNNER_TEMP/cyclonedx-fixtures/compliance-1.6.cdx.json"
          "$RUNNER_TEMP/cyclonedx-fixtures/compliance-1.7.cdx.json"
          "$RUNNER_TEMP/purpleray-cli-smoke/result-ță.cdx.json"

      - name: Cache pinned external-scanner handoff inputs
        if: runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/external-scanner-downloads
          key: external-scanners-linux-amd64-v1-grype-0.117.0-db-1787293044-osv-2.5.1-npm-1787320137148317

      - name: Verify external vulnerability-scanner SBOM handoff
        if: runner.os == 'Linux'
        timeout-minutes: 8
        shell: bash
        run: |
          download_dir="$RUNNER_TEMP/external-scanner-downloads"
          runtime_dir="$RUNNER_TEMP/external-scanner-runtime"
          fixture="$RUNNER_TEMP/purpleray-cli-smoke/result-ță.cdx.json"
          grype_archive="$download_dir/grype_0.117.0_linux_amd64.tar.gz"
          grype_db_archive="$download_dir/grype-db-v6.1.9-20260821.tar.zst"
          osv_binary="$download_dir/osv-scanner-v2.5.1-linux-amd64"
          osv_db_archive="$download_dir/osv-npm-1787320137148317.zip"
          mkdir -p "$download_dir" "$runtime_dir/tools" \
            "$runtime_dir/grype-db" "$runtime_dir/osv-cache/osv-scalibr/npm"

          download() {
            local url="$1"
            local output="$2"
            if [[ -e "$output" || -L "$output" ]]; then
              if [[ ! -f "$output" || -L "$output" ]]; then
                echo "Cached scanner input is not a regular file: $output" >&2
                exit 1
              fi
              return
            fi
            curl --fail --location --silent --show-error --retry 2 \
              --connect-timeout 15 --max-time 180 \
              --proto '=https' --tlsv1.2 --output "$output" "$url"
          }

          download \
            'https://github.com/anchore/grype/releases/download/v0.117.0/grype_0.117.0_linux_amd64.tar.gz' \
            "$grype_archive"
          download \
            'https://grype.anchore.io/databases/v6/vulnerability-db_v6.1.9_2026-08-20T16:14:23Z_1787293044.tar.zst?checksum=sha256%3Adca26dd65bd0c4ba626af404a2e60d983d9302863eabdd8a7e7d42008fb4da3c' \
            "$grype_db_archive"
          download \
            'https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64' \
            "$osv_binary"
          download \
            'https://storage.googleapis.com/osv-vulnerabilities/npm/all.zip?generation=1787320137148317' \
            "$osv_db_archive"

          printf '%s  %s\n' \
            '38525dab1e06f162ebaa02f94d82d1f807076b011a44180cf2777edf1a7b9c26' \
            "$grype_archive" \
            'dca26dd65bd0c4ba626af404a2e60d983d9302863eabdd8a7e7d42008fb4da3c' \
            "$grype_db_archive" \
            'f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be' \
            "$osv_binary" \
            '3633650cc04496aec35012c42ecc809bb3ff6fab8420b333120791ce2dba34a3' \
            "$osv_db_archive" |
            sha256sum --check --strict

          tar -xzf "$grype_archive" -C "$runtime_dir/tools" grype
          chmod +x "$osv_binary"
          grype="$runtime_dir/tools/grype"
          test "$("$grype" version | awk '$1 == "Version:" { print $2; exit }')" = \
            '0.117.0'
          test "$("$osv_binary" --version | \
            awk '$1 == "osv-scanner" && $2 == "version:" { print $3; exit }')" = \
            '2.5.1'
          jq -e '.components[] | select(.purl == "pkg:npm/lodash@4.17.20")' \
            "$fixture" >/dev/null

          export GRYPE_DB_CACHE_DIR="$runtime_dir/grype-db"
          export GRYPE_DB_AUTO_UPDATE=false
          export GRYPE_DB_VALIDATE_AGE=false
          export GRYPE_CHECK_FOR_APP_UPDATE=false
          export GRYPE_EXTERNAL_SOURCES_ENABLE=false
          "$grype" db import "$grype_db_archive"
          "$grype" "sbom:$fixture" --output json \
            --file "$runtime_dir/grype-report.json"
          jq -e '.matches[] | select(
            .artifact.purl == "pkg:npm/lodash@4.17.20" and
            .vulnerability.id == "GHSA-35jh-r3h4-6jhm")' \
            "$runtime_dir/grype-report.json" >/dev/null

          cp "$osv_db_archive" \
            "$runtime_dir/osv-cache/osv-scalibr/npm/all.zip"
          set +e
          XDG_CACHE_HOME="$runtime_dir/osv-cache" "$osv_binary" scan source \
            --offline --offline-vulnerabilities --no-resolve --all-packages \
            --experimental-no-default-plugins --experimental-plugins=sbom \
            --lockfile "$fixture" --format json \
            --output-file "$runtime_dir/osv-report.json" \
            >"$runtime_dir/osv.stdout" 2>"$runtime_dir/osv.stderr"
          osv_status=$?
          set -e
          test "$osv_status" -eq 1
          jq -e '.results[].packages[] | select(
            .package.name == "lodash" and .package.version == "4.17.20" and
            any(.vulnerabilities[]; .id == "GHSA-35jh-r3h4-6jhm"))' \
            "$runtime_dir/osv-report.json" >/dev/null

      - name: Package and verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/package-windows.ps1 -Version '${{ needs.prepare.outputs.version }}'

      - name: Generate and verify Windows package-manager manifests
        if: runner.os == 'Windows'
        run: >-
          python scripts/generate-package-manifests.py
          --version '${{ needs.prepare.outputs.version }}'
          --windows-archive
          'dist/purpleray-sbom-analyzer-v${{ needs.prepare.outputs.version }}-windows-x64.zip'
          --output-dir dist

      - name: Package and verify Linux distributions
        if: runner.os == 'Linux'
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA")
          export SOURCE_DATE_EPOCH
          scripts/package-linux.sh '${{ needs.prepare.outputs.version }}'

      - name: Package and verify macOS application
        if: runner.os == 'macOS'
        run: scripts/package-macos.sh '${{ needs.prepare.outputs.version }}'

      - name: Upload temporary build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: package-${{ matrix.config.id }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub Release
    # A failed platform build must never create a partial release.
    if: ${{ needs.prepare.result == 'success' && needs.build.result == 'success' && needs.prepare.outputs.is_release == 'true' }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 7
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Download successful platform artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Verify available release contents and write checksums
        shell: bash
        run: |
          cd release-assets
          export LC_ALL=C
          version='${{ needs.prepare.outputs.version }}'
          windows="purpleray-sbom-analyzer-v${version}-windows-x64.zip"
          linux="purpleray-sbom-analyzer-v${version}-linux-x64.tar.gz"
          debian="purpleray-sbom-analyzer_${version}_amd64.deb"
          scoop='purpleray-sbom-analyzer.json'
          winget="purpleray-sbom-analyzer-v${version}-winget-manifests.zip"
          macos="purpleray-sbom-analyzer-v${version}-macos.zip"
          required=("$windows" "$linux" "$debian" "$scoop" "$winget")
          for asset in "${required[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Required release asset is missing: $asset" >&2
              exit 1
            fi
          done

          mapfile -t windows_files < <(unzip -Z1 "$windows" | sed -n '/\/$/!p' | sort)
          expected_windows=(LICENSE NOTICE purpleray-sbom-analyzer.exe)
          test "${windows_files[*]}" = "${expected_windows[*]}"
          unzip -p "$windows" purpleray-sbom-analyzer.exe |
            file - | grep -E 'PE32\+ executable.*x86-64'
          cmp ../LICENSE <(unzip -p "$windows" LICENSE)
          cmp ../NOTICE <(unzip -p "$windows" NOTICE)

          linux_root="purpleray-sbom-analyzer-v${version}-linux-x64"
          mapfile -t linux_files < <(tar -tzf "$linux" | sed -n '/\/$/!p' | sort)
          expected_linux=(
            "$linux_root/LICENSE"
            "$linux_root/NOTICE"
            "$linux_root/purpleray-sbom-analyzer"
            "$linux_root/share/applications/io.github.aidamian.PurpleRaySBOMAnalyzer.desktop"
            "$linux_root/share/icons/hicolor/256x256/apps/io.github.aidamian.PurpleRaySBOMAnalyzer.png"
            "$linux_root/share/metainfo/io.github.aidamian.PurpleRaySBOMAnalyzer.metainfo.xml"
          )
          test "${linux_files[*]}" = "${expected_linux[*]}"
          tar -xOzf "$linux" "$linux_root/purpleray-sbom-analyzer" |
            file - | grep -E 'ELF 64-bit.*x86-64'
          cmp ../LICENSE <(tar -xOzf "$linux" "$linux_root/LICENSE")
          cmp ../NOTICE <(tar -xOzf "$linux" "$linux_root/NOTICE")

          test "$(dpkg-deb --field "$debian" Package)" = 'purpleray-sbom-analyzer'
          test "$(dpkg-deb --field "$debian" Version)" = "$version"
          test "$(dpkg-deb --field "$debian" Architecture)" = 'amd64'
          expected_dependencies='ca-certificates, libc6 (>= 2.34), libgtk-3-0, libssl3'
          test "$(dpkg-deb --field "$debian" Depends)" = "$expected_dependencies"
          mapfile -t debian_files < <(
            dpkg-deb --fsys-tarfile "$debian" |
              tar -tf - |
              sed -e 's#^\./##' -e '/^$/d' -e '/\/$/d' |
              sort
          )
          expected_debian=(
            'usr/bin/purpleray-sbom-analyzer'
            'usr/share/applications/io.github.aidamian.PurpleRaySBOMAnalyzer.desktop'
            'usr/share/doc/purpleray-sbom-analyzer/LICENSE'
            'usr/share/doc/purpleray-sbom-analyzer/NOTICE'
            'usr/share/doc/purpleray-sbom-analyzer/copyright'
            'usr/share/icons/hicolor/256x256/apps/io.github.aidamian.PurpleRaySBOMAnalyzer.png'
            'usr/share/metainfo/io.github.aidamian.PurpleRaySBOMAnalyzer.metainfo.xml'
          )
          test "${debian_files[*]}" = "${expected_debian[*]}"
          dpkg-deb --fsys-tarfile "$debian" |
            tar -xOf - ./usr/bin/purpleray-sbom-analyzer |
            file - | grep -E 'ELF 64-bit.*x86-64'
          dpkg-deb --fsys-tarfile "$debian" |
            tar -xOf - ./usr/share/doc/purpleray-sbom-analyzer/LICENSE |
            cmp - ../LICENSE
          dpkg-deb --fsys-tarfile "$debian" |
            tar -xOf - ./usr/share/doc/purpleray-sbom-analyzer/NOTICE |
            cmp - ../NOTICE

          python3 ../scripts/generate-package-manifests.py \
            --version "$version" --windows-archive "$windows" \
            --output-dir . --verify-only

          available=("${required[@]}")

          if [[ -f "$macos" ]]; then
            test "$(unzip -Z1 "$macos" | grep -Ec '^PurpleRay SBOM Analyzer\.app/Contents/MacOS/[^/]+$')" -eq 1
            unzip -p "$macos" 'PurpleRay SBOM Analyzer.app/Contents/MacOS/purpleray-sbom-analyzer' |
              file - | grep -E 'Mach-O 64-bit.*x86_64'
            available+=("$macos")
          fi

          test "${#available[@]}" -gt 0
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "${#available[@]}"
          printf 'Publishing %s\n' "${available[@]}"
          printf '%s\n' "${available[@]}" | sort | xargs sha256sum > SHA256SUMS.txt

      - name: Validate package manifests against pinned official schemas
        timeout-minutes: 2
        shell: bash
        run: |
          sudo apt-get update --quiet \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20
          sudo apt-get install --yes --no-install-recommends \
            python3-jsonschema python3-yaml
          python3 scripts/validate-package-manifests.py --self-test \
            --timeout-seconds 15 \
            --scoop-manifest release-assets/purpleray-sbom-analyzer.json \
            --winget-archive \
            'release-assets/purpleray-sbom-analyzer-v${{ needs.prepare.outputs.version }}-winget-manifests.zip'

      - name: Attest release build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Create or verify version tag
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          test -n "$TAG"
          git fetch --force --tags
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            tagged_commit=$(git rev-list -n 1 "$TAG")
            test "$tagged_commit" = "$GITHUB_SHA"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$GITHUB_SHA" -m "PurpleRay SBOM Analyzer $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Generate concise release notes
        shell: bash
        env:
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [[ -n "$PREVIOUS_TAG" ]]; then
            changes=$(git log --format='- %s' "${PREVIOUS_TAG}..${GITHUB_SHA}")
          else
            changes=$(git log --format='- %s' "$GITHUB_SHA")
          fi
          if [[ -z "$changes" ]]; then
            changes="- Rebuild ${GITHUB_SHA:0:8}"
          fi
          {
            echo "PurpleRay SBOM Analyzer $TAG"
            echo
            echo 'Changes:'
            printf '%s\n' "$changes"
            echo
            echo '### Verify build provenance'
            echo
            echo 'Download an artifact and run:'
            echo
            echo '```text'
            echo 'gh attestation verify <downloaded-file> --repo aidamian/PurpleRay_SBOM_Analyzer'
            echo '```'
            echo
            echo '### Code signing policy'
            echo
            echo 'Free code signing provided by [SignPath.io](https://signpath.io/), certificate by [SignPath Foundation](https://signpath.org/). Signing will be activated after project approval. [Read the policy](https://github.com/aidamian/PurpleRay_SBOM_Analyzer#code-signing-policy).'
          } > release-notes.md

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "PurpleRay SBOM Analyzer $TAG" --notes-file release-notes.md
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "PurpleRay SBOM Analyzer $TAG" --notes-file release-notes.md
          fi

      - name: Report WinGet submission gate
        shell: bash
        env:
          WINGET_SUBMISSION_ENABLED: ${{ vars.WINGET_SUBMISSION_ENABLED }}
        run: |
          if [[ "$WINGET_SUBMISSION_ENABLED" == true ]]; then
            echo '::notice title=WinGet submission enabled::The credential-gated WinGet submission job will run after this release.'
            # shellcheck disable=SC2016
            printf '%s\n' \
              '### WinGet submission' \
              '' \
              'Enabled by the `WINGET_SUBMISSION_ENABLED` repository variable; the credential gate runs next.' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::notice title=WinGet submission disabled::Set WINGET_SUBMISSION_ENABLED=true after initial upstream approval to opt in.'
            # shellcheck disable=SC2016
            printf '%s\n' \
              '### WinGet submission' \
              '' \
              'Disabled (the default). No additional runner was allocated; the release includes the validated manifest archive.' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # Opt in only after the operator has arranged the initial upstream package:
  # set WINGET_SUBMISSION_ENABLED=true and add WINGET_CREATE_GITHUB_TOKEN.
  submit-winget:
    name: Submit WinGet manifest (credential-gated)
    if: ${{ always() && needs.prepare.result == 'success' && needs.release.result == 'success' && needs.prepare.outputs.is_release == 'true' && vars.WINGET_SUBMISSION_ENABLED == 'true' }}
    needs: [prepare, release]
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check WinGet submission credential
        id: credential
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_CREATE_GITHUB_TOKEN)) {
            'enabled=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            '::notice title=WinGet submission skipped::WINGET_CREATE_GITHUB_TOKEN is not configured; release assets and manifests were still published.'
            @'
          ### WinGet submission

          Skipped: the `WINGET_CREATE_GITHUB_TOKEN` repository secret is not configured.
          The release itself succeeded and includes the validated WinGet manifest archive.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            'enabled=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            @'
          ### WinGet submission

          Credential gate passed; submission to `microsoft/winget-pkgs` is running.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Download and verify pinned WingetCreate
        if: steps.credential.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $tool = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest `
            -Uri 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe' `
            -OutFile $tool
          $actual = (Get-FileHash -LiteralPath $tool -Algorithm SHA256).Hash
          $expected = '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA'
          if ($actual -ne $expected) {
            throw "WingetCreate SHA-256 mismatch: $actual"
          }

      - name: Update and submit portable WinGet manifest
        if: steps.credential.outputs.enabled == 'true'
        shell: pwsh
        env:
          WINGET_CREATE_GITHUB_TOKEN: ${{ secrets.WINGET_CREATE_GITHUB_TOKEN }}
        run: |
          $version = '${{ needs.prepare.outputs.version }}'
          $identifier = 'AndreiIonutDamian.PurpleRaySBOMAnalyzer'
          $installerUrl = (
            'https://github.com/aidamian/PurpleRay_SBOM_Analyzer/releases/' +
            "download/v$version/purpleray-sbom-analyzer-v$version-windows-x64.zip"
          )
          $releaseNotesUrl = (
            'https://github.com/aidamian/PurpleRay_SBOM_Analyzer/releases/' +
            "tag/v$version"
          )
          $tool = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          & $tool update $identifier --urls $installerUrl --version $version `
            --release-notes-url $releaseNotesUrl --submit --no-open `
            --prtitle "PurpleRay SBOM Analyzer $version"
          if ($LASTEXITCODE -ne 0) {
            throw "WingetCreate submission failed with exit code $LASTEXITCODE"
          }
          'Submitted the portable manifest update to `microsoft/winget-pkgs`.' |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
